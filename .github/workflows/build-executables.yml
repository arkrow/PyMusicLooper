name: Build Standalone Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pymusiclooper-windows-x64.exe
            dist_binary: dist/pymusiclooper.exe
          - os: ubuntu-latest
            artifact_name: pymusiclooper-linux-x64
            dist_binary: dist/pymusiclooper

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"

      - name: Install dependencies and PyInstaller
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv sync --locked --no-dev
          uv pip install pyinstaller

      - name: Build executable with PyInstaller
        run: uv run --no-sync pyinstaller --clean --noconfirm pymusiclooper.spec

      - name: Smoke test built executable
        shell: bash
        run: |
          "./${{ matrix.dist_binary }}" --version
          "./${{ matrix.dist_binary }}" --help

      - name: Stage release artifact
        shell: bash
        run: cp "${{ matrix.dist_binary }}" "${{ matrix.artifact_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Upload asset to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.artifact_name }}" --clobber
