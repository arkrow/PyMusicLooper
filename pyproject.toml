[project]
name = "pymusiclooper"
version = "3.6.0"
description = "Repeat music endlessly and create seamless music loops, with play/export/tagging support."
authors = [{ name = "arkrow", email = "arkrow@protonmail.com" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "librosa>=0.11.0,<0.12.0",
  "numpy>=1.25.0",
  "soundfile>=0.13.1",
  "sounddevice>=0.5.0",
  "rich-click>=1.8.0,<2",
  "rich>=13.4.2",
  "pytaglib>=3.1.0,<4",
  "numba>=0.59.1",
  "yt-dlp[default]>=2026.10.21",
  "click-params>=0.5.0,<0.6",
  "click-option-group>=0.5.6,<0.6",
  "lazy-loader>=0.4",
]

[project.urls]
Repository = "https://github.com/arkrow/PyMusicLooper"
Changelog = "https://github.com/arkrow/PyMusicLooper/blob/master/CHANGELOG.md"

[project.scripts]
pymusiclooper = "pymusiclooper.__main__:cli"

[dependency-groups]
dev = [
  "pytest>=8.0",
]
docs = [
  "sphinx>=8.0",
  "sphinx-click>=6.0",
  "furo>=2024.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
ignore = ["E501", "E402"]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
